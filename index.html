<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#20134a">
<title>For Madi</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#0b0820;overflow:hidden;font-family:'Press Start 2P',monospace;color:#fff}
[hidden]{display:none!important}
img,canvas{image-rendering:pixelated}
#game{--g:16%;--s:4;position:fixed;inset:0;max-width:520px;margin:auto;overflow:hidden;background:var(--sky)}
.s-title{--sky:linear-gradient(#2b1650,#a8456f 72%,#f2a65a)}
.s-intro{--sky:linear-gradient(#2a1a5e,#7a3f8f 70%,#e58a7a)}
.s-cake{--sky:linear-gradient(#241353,#4b2a78 75%,#8a4a8c);--g:236px}
.s-poem{--sky:linear-gradient(#070a2a,#14205a 80%,#27386e)}
.s-play{--sky:linear-gradient(#0c1040,#232a6e 80%,#3a3f86)}
.s-final{--sky:linear-gradient(#03041a,#0a0f3a 85%,#141a52)}
#stars i{position:absolute;background:#fff;width:2px;height:2px;animation:tw 2.4s steps(2) infinite}
#stars i.b{width:4px;height:4px;background:#ffe9a8}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#moon{display:none;position:absolute;right:12%;top:9%;width:38px;height:38px;background:#fff3b0;box-shadow:inset -9px -7px 0 #e3d48c;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.s-poem #moon,.s-play #moon,.s-final #moon{display:block}
.cloud{position:absolute;width:56px;height:12px;background:#fff;opacity:.18;box-shadow:12px -10px 0 -2px #fff,32px -10px 0 -2px #fff;animation:drift var(--d,70s) linear infinite;left:-120px}
@keyframes drift{to{transform:translateX(120vw)}}
#ground{position:absolute;left:0;right:0;bottom:0;height:var(--g);background:linear-gradient(#58b06a 0 8px,#3f8a4e 8px 14px,#2b2150 14px);display:none}
.s-intro #ground,.s-cake #ground,.s-poem #ground,.s-play #ground,.s-final #ground{display:block}
.s-poem #ground,.s-play #ground,.s-final #ground{filter:brightness(.5) saturate(.8)}
#dimv{position:absolute;inset:0;background:#05052a;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3}
.dim #dimv{opacity:.4}
.scene{position:absolute;inset:0;display:none;pointer-events:none;z-index:1}
.scene.on{display:block}#sc-cake{z-index:3}.scene .pe{pointer-events:auto}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s steps(6);z-index:20}
#fade.on{opacity:1;pointer-events:auto}
.shake{animation:shk .35s steps(6)}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
/* buttons */
.btn{font:inherit;font-size:12px;color:#fff;background:#ff7aa8;border:0;padding:15px 18px;min-height:52px;cursor:pointer;text-shadow:2px 2px 0 #8a2a50;margin:4px;
box-shadow:inset -4px -4px 0 #c2436f,inset 4px 4px 0 #ffb3cf,0 0 0 4px #2a0f3a,6px 6px 0 4px rgba(0,0,0,.35);transition:transform .06s steps(2),box-shadow .06s steps(2)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(4px,4px);box-shadow:inset -4px -4px 0 #c2436f,inset 4px 4px 0 #ffb3cf,0 0 0 4px #2a0f3a,2px 2px 0 4px rgba(0,0,0,.35)}
.btn.big{font-size:20px;padding:20px 34px;animation:pulse 1.4s steps(2) infinite}
.btn.blue{background:#6aa8ff;text-shadow:2px 2px 0 #2a4f9a;box-shadow:inset -4px -4px 0 #3f6fc4,inset 4px 4px 0 #b3d1ff,0 0 0 4px #0f1a3a,6px 6px 0 4px rgba(0,0,0,.35)}
.btn.small{font-size:9px;padding:12px 10px;min-height:48px}
@keyframes pulse{50%{transform:scale(1.04)}}
.bot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;justify-content:center;flex-wrap:wrap;gap:8px;z-index:4}
#snd{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;z-index:30;width:44px;height:44px;padding:0;font-size:16px;min-height:44px;margin:0}
/* title */
#sc-title{text-align:center;padding-top:calc(env(safe-area-inset-top) + 16vh)}
#ttl{font-size:clamp(26px,9.5vw,46px);line-height:1.3;margin:0;text-shadow:4px 4px 0 #5a1f4a,-2px -2px 0 #ffb3cf;letter-spacing:2px;transition:transform .8s steps(8),opacity .8s steps(8)}
#mt{display:inline-block;color:#ffd86b;cursor:pointer;pointer-events:auto}#mt.hop{animation:hop .3s steps(3)}
@keyframes hop{50%{transform:translateY(-12px)}}
#sub{font-size:11px;margin:22px 0 46px;color:#ffe9f2;line-height:1.7;transition:opacity .6s steps(6)}
#hint{font-size:8px;margin-top:22px;color:#ffd1e3;opacity:.8;transition:opacity .6s}
.out #ttl{transform:translateY(-60px);opacity:0}.out #sub,.out #hint,.out #play{opacity:0}
/* madi */
#madi{position:absolute;bottom:calc(var(--g) - 10px);left:50%;z-index:2;transform:translateX(-50%);transition:left .7s steps(10),opacity .4s;cursor:pointer}
#madi.hide{opacity:0;pointer-events:none}
#mb{animation:bob 1.2s steps(2) infinite}
#mb.tilt{transform:rotate(-7deg)}#mb.bounce{animation:jump .35s steps(4) 3}#mb.drop{animation:drop .7s steps(7)}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes jump{50%{transform:translateY(-22px)}}
@keyframes drop{from{transform:translateY(-260px)}}
#mi{width:calc(24px*var(--s));height:calc(30px*var(--s));display:block}
/* dialog */
#dlg{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:8;display:none;gap:12px;align-items:flex-start;min-height:100px;padding:14px;background:#1a1040;border:4px solid #fff;box-shadow:0 0 0 4px #1a1040,6px 6px 0 4px rgba(0,0,0,.4);cursor:pointer}
#dlg.on{display:flex}
#pt{width:54px;height:54px;flex:none;background:#3a2670;border:3px solid #ff9ec0;display:block}
#nm{font-size:9px;color:#ff9ec0;margin-bottom:8px;min-height:10px}
#tx{font-size:11px;line-height:1.7}
#nx{position:absolute;right:12px;bottom:8px;font-size:10px;color:#ffd86b;animation:bl .6s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#bub{position:absolute;left:50%;top:21%;transform:translateX(-50%);z-index:7;max-width:84%;background:#fff;color:#2a1440;font-size:10px;line-height:1.6;padding:12px;text-align:center;display:none;box-shadow:0 0 0 4px #2a1440,5px 5px 0 4px rgba(0,0,0,.3);pointer-events:none}
#bub img{width:40px;height:40px;flex:none;background:#3a2670;border:2px solid #ff9ec0}
#bub.on{display:flex;align-items:center;gap:10px;animation:pop .2s steps(3)}
@keyframes pop{from{transform:translateX(-50%) scale(.7)}}
#fx{position:absolute;inset:0;z-index:5;pointer-events:none}
/* cake scene */
#q{position:absolute;top:calc(env(safe-area-inset-top) + 5%);left:12px;right:12px;display:flex;align-items:center;gap:12px;font-size:12px;line-height:1.6;padding:10px;background:#1a1040;border:4px solid #fff;box-shadow:0 0 0 4px #1a1040,5px 5px 0 4px rgba(0,0,0,.4)}
#qp{width:56px;height:56px;flex:none;background:#3a2670;border:3px solid #ff9ec0}
#cake{position:absolute;bottom:calc(var(--g) - 4px);right:5%;width:150px}
#cds{display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-end;margin:0 auto 4px;min-height:20px;cursor:pointer}
.cd{width:5px;height:12px;margin:1px;background:repeating-linear-gradient(#ff7aa8 0 3px,#fff 3px 6px);position:relative;animation:cin .2s steps(3)}
.cd.lv{animation:cout .15s steps(3) forwards}
@keyframes cin{from{transform:scale(0) translateY(-8px)}}@keyframes cout{to{transform:scale(0)}}
.cd u{display:none;position:absolute;left:0;top:-7px;width:5px;height:6px;background:#ffd23f;box-shadow:inset 0 -2px 0 #ff8a2a;animation:fl .28s steps(2) infinite}
.cd.lit u{display:block}@keyframes fl{50%{transform:scaleY(1.3) translateX(1px)}}
.t1{width:100px;height:30px;margin:0 auto;background:#ffd6e7;box-shadow:inset 0 6px 0 #fff,inset 0 -4px 0 #f0a3c2,0 0 0 4px #5a2a4a}
.t2{width:140px;height:40px;margin:0 auto;background:#b86b3d;box-shadow:inset 0 8px 0 #ffd6e7,inset 0 -5px 0 #8f4a26,0 0 0 4px #5a2a4a}
.plate{width:150px;height:8px;background:#e8e8f5;box-shadow:0 0 0 4px #5a2a4a}
#ctl{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:12px 6px;background:rgba(20,10,50,.85);border:4px solid #ff9ec0;text-align:center}
#row{display:flex;align-items:center;justify-content:center;gap:6px}
#age{font-size:30px;min-width:76px;color:#ffd86b;text-shadow:3px 3px 0 #5a2a4a}
#age.bump{animation:bump .18s steps(3)}@keyframes bump{50%{transform:scale(1.35)}}
.s-wish #ctl,.s-wish #q{display:none}
/* poem — paper scroll */
#scroll{position:absolute;top:calc(env(safe-area-inset-top) + 5%);left:50%;transform:translateX(-50%);width:max-content;max-width:98%}
.rod{height:12px;margin:0 -2px;background:linear-gradient(#d9a45c 0 4px,#a8703a 4px 8px,#6e4521 8px);box-shadow:0 0 0 3px #3a2410,4px 4px 0 3px rgba(0,0,0,.3);position:relative}
.rod::before,.rod::after{content:'';position:absolute;top:-3px;bottom:-3px;width:8px;background:#e8c27a;box-shadow:0 0 0 3px #3a2410}.rod::before{left:-8px}.rod::after{right:-8px}
#paper{height:0;overflow:hidden;background:#f3e3b8;margin:0 6px;box-shadow:inset 6px 0 0 #e6d29b,inset -6px 0 0 #e6d29b,inset 0 -4px 0 #e0c98e;transition:height 2.2s steps(18)}
#poem{position:relative;padding:14px 20px;font-size:clamp(7px,2.2vw,9px);line-height:20px;color:#4a3320}
#poem::before{content:'';position:absolute;left:12px;top:8px;bottom:8px;width:24px;background:rgba(190,60,40,.14);opacity:0;transition:opacity 2s}
#poem.rev::before{opacity:1}
.ln{display:flex;gap:5px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity 1.2s,transform 1.2s}.ln.show{opacity:1;transform:none}.gap{height:14px}
.ln b{width:14px;flex:none;text-align:center;font-size:1.2em;color:#8a3a12;transition:all 1.4s}
.ln span{transition:opacity 2s}
#poem.dim .ln span{opacity:.35}#poem.dim .ln b{color:#a82a10}
#poem.rev .ln b{color:#c0281c;transform:scale(1.35)}
#note{margin-top:14px;font-size:10px;color:#fff;opacity:0;transition:opacity 1.5s;text-align:center;text-shadow:2px 2px 0 #000}
#note2{margin-top:10px;font-size:11px;color:#ffd86b;letter-spacing:2px;opacity:0;transition:opacity 2s;text-align:center;text-shadow:2px 2px 0 #000,0 0 8px #ffb347}
#note.on,#note2.on{opacity:1}
#secret{position:absolute;top:calc(env(safe-area-inset-top) + 3%);left:14%;width:5px;height:5px;background:#ffe9a8;animation:tw 1.6s steps(2) infinite}
#secret::after{content:'';position:absolute;inset:-14px}
.ff{position:absolute;width:3px;height:3px;background:#d8ff7a;box-shadow:0 0 6px #d8ff7a;animation:ffa 6s ease-in-out infinite}
@keyframes ffa{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-16px);opacity:1}}
/* explore */
#hintp{position:absolute;top:calc(env(safe-area-inset-top) + 5%);left:0;right:0;text-align:center;font-size:9px;color:#cfd2ff;line-height:1.7}
.obj{position:absolute;bottom:calc(var(--g) - 6px);transform:translateX(-50%);cursor:pointer}
.obj.near{animation:jump .6s steps(3) infinite}
.obj.near::after{content:'!';position:absolute;top:-22px;left:50%;color:#ffd86b;font-size:12px;transform:translateX(-50%)}
.obj.seen{filter:brightness(.8)}
.talk #pad{display:none}
#pad{justify-content:space-between;padding:0 14px}
#pad .btn{min-width:84px;font-size:18px}
#oneMoreB{top:calc(env(safe-area-inset-top) + 12%);bottom:auto}
/* final */
.hs{position:absolute;width:6px;height:6px;background:#ffe9a8;box-shadow:0 0 8px #ffe9a8;transition:left 4.5s cubic-bezier(.4,0,.2,1),top 4.5s cubic-bezier(.4,0,.2,1);z-index:2}
#hs.pulse{animation:hb .5s steps(4)}@keyframes hb{50%{transform:scale(1.15)}}
#hs.beat{animation:hb 2.4s steps(6) infinite}
#hh{position:absolute;z-index:3;cursor:pointer}
#fm{position:absolute;left:0;right:0;text-align:center;z-index:2}
#f1,#f2{opacity:0;transition:opacity 2s;text-shadow:0 0 10px #ff8fb5}#f1{font-size:12px;line-height:1.7;color:#ffd1e3}#f2{font-size:11px;margin-top:14px;color:#ffe9a8}
#f1.on,#f2.on{opacity:1}
@media (max-height:520px){.s-cake{--g:150px}#q{font-size:10px;top:4%}#age{font-size:20px}.btn{padding:8px 10px;min-height:38px}}
</style></head><body>
<div id="game" class="s-title">
 <div id="stars"></div><div id="moon"></div>
 <div class="cloud" style="top:12%;--d:80s"></div><div class="cloud" style="top:26%;--d:110s;animation-delay:-40s"></div><div class="cloud" style="top:40%;--d:95s;animation-delay:-70s"></div>
 <div id="ground"></div><div id="dimv"></div>

 <section id="sc-title" class="scene on">
  <h1 id="ttl">FOR<br><span id="mt" class="pe">MADI</span></h1>
  <div id="sub">A tiny birthday<br>adventure</div>
  <button id="play" class="btn big pe">PLAY</button>
  <div id="hint">best experienced with sound :)</div>
 </section>

 <section id="sc-cake" class="scene">
  <div id="q"><img id="qp" alt=""><span id="qt"></span></div>
  <div id="cake" class="pe"><div id="cds"></div><div class="t1"></div><div class="t2"></div><div class="plate"></div></div>
  <div id="ctl" class="pe">
   <div id="row"><button class="btn small blue" id="dn">◀ YOUNGER</button><div id="age">15</div><button class="btn small blue" id="up">OLDER ▶</button></div>
   <button class="btn" id="submit" style="margin-top:12px;width:70%">SUBMIT</button>
  </div>
  <div class="bot"><button class="btn pe" id="blowB" hidden>BLOW OUT THE CANDLES</button><button class="btn pe" id="contB" hidden>CONTINUE</button></div>
 </section>

 <section id="sc-poem" class="scene">
  <div id="secret" class="pe"></div>
  <div id="scroll"><div class="rod"></div><div id="paper"><div id="poem"></div></div><div class="rod"></div><div id="note"></div><div id="note2"></div></div>
  <div class="bot" style="bottom:calc(env(safe-area-inset-bottom) + 6px)"><button class="btn pe" id="keepB" hidden>NEXT</button></div>
 </section>

  <section id="sc-final" class="scene">
  <div id="hs"></div><div id="hh" class="pe"></div>
  <div id="fm"><div id="f1"></div><div id="f2"></div></div>
  <div class="bot"><button class="btn small pe" id="againB" hidden>PLAY AGAIN</button></div>
 </section>

 <div id="madi" class="hide"><div id="mb"><img id="mi" alt="Madi"></div></div>
 <canvas id="fx"></canvas>
 <div id="bub"><img id="bp" alt=""><span id="bt"></span></div>
 <div id="dlg"><img id="pt" alt=""><div><div id="nm"></div><div id="tx"></div></div><div id="nx">▼</div></div>
 <div id="fade"></div>
 <button id="snd" class="btn">♪</button>
</div>

function drawSprite(p){

  R('h1',7,7,3);R('h1',14,7,3);R('h1',7,8,1,3);R('h1',16,8,1,3);R('h2',9,7);R('h2',14,7);

  R('gd',6,15);R('gd',17,15);

const fx=$('#fx'), fxc=fx.getContext('2d'), P=[]; let raf=0;
const HEART=ICONS.heart.m;
function run(){ if(!raf)raf=requestAnimationFrame(tick); }
function tick(){ raf=0; fxc.clearRect(0,0,fx.width,fx.height);
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0; if(--p.l<=0||p.y>fx.height+20){P.splice(i,1);continue}
    fxc.globalAlpha=Math.min(1,p.l/20); fxc.fillStyle=p.c;
    if(p.h){HEART.forEach((r,y)=>[...r].forEach((v,xx)=>{if(v=='1')fxc.fillRect((p.x+xx*p.s)|0,(p.y+y*p.s)|0,p.s,p.s)}))}
    else fxc.fillRect(p.x|0,p.y|0,p.s,p.s2||p.s); }
  fxc.globalAlpha=1; if(P.length)run(); }
const COLS=['#ffd23f','#ff7aa8','#fff','#7ad7ff','#b79af0'];
function burst(x,y,n=16){ for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(1,3.5);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,g:.08,l:rnd(30,55),c:pick(COLS),s:4})} run(); }
function confetti(){ for(let i=0;i<70;i++)P.push({x:rnd(0,fx.width),y:rnd(-fx.height*.3,-10),vx:rnd(-1,1),vy:rnd(1,2.6),g:.01,l:rnd(150,220),c:pick(COLS),s:5,s2:7}); run(); }
function hearts(x,y,n=1){ for(let i=0;i<n;i++)P.push({h:1,s:3,x:x+rnd(-14,14),y:y+rnd(-6,6),vx:rnd(-.5,.5),vy:rnd(-1.6,-.8),l:rnd(55,90),c:'#ff5c8a'}); run(); }
function smoke(x,y){ P.push({x,y,vx:rnd(-.4,.4),vy:rnd(-.9,-.4),l:55,c:'#c8c8d8',s:4}); run(); }
function ctr(el,top){ const r=el.getBoundingClientRect(),g=game.getBoundingClientRect(); return [r.left-g.left+r.width/2, r.top-g.top+(top?0:r.height/2)]; }
function shake(){ game.classList.remove('shake'); void game.offsetWidth; game.classList.add('shake'); }
let bubT; function toast(t,ms=2400,who='marcus'){ $('#bp').src=who==='madi'?PORT(base):marcusPortrait; $('#bt').textContent=t; bub.classList.remove('on'); void bub.offsetWidth; bub.classList.add('on'); clearTimeout(bubT); bubT=setTimeout(()=>bub.classList.remove('on'),ms); }

/* =====================================================================
   6. MADI controller (poses, blinking, tapping)
   ===================================================================== */
let base='idle', tmpT=null;
const draw=p=>{ mi.src=SP[p]||SP.idle; };
mi.onerror=()=>{ mi.onerror=null; for(const k in SPC)SP[k]=SPC[k].toDataURL(); draw(base); }; // falls back to built-in sprites if /assets is missing
function setBase(p){ base=p; clearTimeout(tmpT); tmpT=null; draw(p); }
function flash(p,ms){ draw(p); clearTimeout(tmpT); tmpT=setTimeout(()=>{tmpT=null;draw(base)},ms); }
(function blinker(){ if(!tmpT&&SP[base+'_b'])flash(base+'_b',140); setTimeout(blinker,rnd(2200,4500)); })();
async function wave(ms){ const e=Date.now()+ms; while(Date.now()<e){ draw('wave'); await sleep(230); draw('wave2'); await sleep(230);} draw(base); }
function anim(c,ms){ mb.classList.remove(c); void mb.offsetWidth; mb.classList.add(c); setTimeout(()=>mb.classList.remove(c),ms); }
let taps=[];
madi.addEventListener('pointerdown',e=>{ e.stopPropagation(); const n=Date.now(); taps=taps.filter(t=>n-t<2200); taps.push(n); SFX.pop();
  const [x,y]=ctr(madi,true); hearts(x,y+4,1); flash(pick(['laugh','happy','surprised']),500); anim('bounce',1000);
  if(taps.length>=5){taps=[];toast(T.tapSpam,2400,'madi')} });
const showMadi=(left,show=true)=>{ madi.style.left=left; madi.classList.toggle('hide',!show); };

/* =====================================================================
   7. DIALOGUE SYSTEM (portrait, name, typewriter, tap to skip/continue)
   ===================================================================== */
let cur=null;
function say(t,who='marcus',label=''){ return new Promise(res=>{ if(cur)clearInterval(cur.t); dlg.classList.add('on'); game.classList.add('talk');
  const m=who==='madi', k=who==='marcus'; pt.style.display=(m||k)?'block':'none'; pt.style.width=pt.style.height=(k?64:54)+'px'; if(m)pt.src=PORT(base); if(k)pt.src=marcusPortrait; nm.textContent=m?madiName:k?senderName:label; tx.textContent=''; nx.style.visibility='hidden';
  const ch=Array.from(t); let i=0; cur={res,full:t,done:false};
  cur.t=setInterval(()=>{ i++; tx.textContent=ch.slice(0,i).join(''); if(i%3==0)SFX.tick(); if(i>=ch.length)fin(); },30); }); }
function fin(){ clearInterval(cur.t); cur.done=true; tx.textContent=cur.full; nx.style.visibility='visible'; }
dlg.addEventListener('pointerdown',()=>{ if(!cur)return; SFX.click(); if(!cur.done)fin(); else{ const r=cur.res; cur=null; r(); } });
function hideDlg(){ dlg.classList.remove('on'); game.classList.remove('talk'); }
async function lines(a,who){ for(const l of a) await say(l,who); }

/* =====================================================================
   8. SCENE MANAGER (pixel-stepped fade)
   ===================================================================== */
async function go(name,cls){ fade.classList.add('on'); await sleep(560); $$('.scene').forEach(s=>s.classList.remove('on')); const sc_=$('#sc-'+name); if(sc_)sc_.classList.add('on');
  game.className=cls||('s-'+name); hideDlg(); bub.classList.remove('on'); await sleep(80); fade.classList.remove('on'); await sleep(480); }
function makeStars(n,big){ const s=$('#stars'); for(let i=0;i<n;i++){const e=document.createElement('i'); e.style.cssText=`left:${rnd(0,100)}%;top:${rnd(0,big?70:55)}%;animation-delay:${rnd(0,3)}s;animation-duration:${rnd(1.6,3.4)}s`; if(Math.random()<.12)e.className='b'; s.appendChild(e);} }

/* =====================================================================
   9. SCENES
   ===================================================================== */
// ---- Title ----
let mt=0;
$('#mt').addEventListener('pointerdown',e=>{ e.stopPropagation(); const el=$('#mt'); el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop'); initAudio(); SFX.pop();
  if(++mt>=6){ mt=0; const [x,y]=ctr(el); hearts(x,y,10); [0,150,300].forEach(t=>setTimeout(()=>hearts(x,y,5),t)); SFX.heart(); } });
$('#play').onclick=async()=>{ initAudio(); SFX.win(); startMusic(); $('#sc-title').classList.add('out'); await sleep(900); intro(); };

// ---- Intro ----
async function intro(){ await go('intro'); setBase('idle'); showMadi('50%'); anim('drop',700); await sleep(900);
  const w=wave(1800); await say(T.intro[0]); await w; await say(T.intro[1]); flash('surprised',600); await say(T.intro[2]); hideDlg(); cakeScene(); }

// ---- Cake / age game ----
let age=15, lockAge=false, cakeState='age', lastWrong=-1;
const cds=$('#cds'), ageEl=$('#age');
function setCandles(n){ const cols=n<=16?8:n<=36?12:16; cds.style.width=cols*8+'px';
  let act=[...cds.querySelectorAll('.cd:not(.lv)')];
  while(act.length>n){ const c=act.pop(); c.classList.add('lv'); setTimeout(()=>c.remove(),160); }
  while(act.length<n){ const c=document.createElement('i'); c.className='cd'; c.innerHTML='<u></u>'; cds.appendChild(c); act.push(c); } }
function setAge(n,user){ n=Math.max(1,Math.min(100,n)); if(n===age||lockAge)return; age=n; ageEl.textContent=n; ageEl.classList.remove('bump'); void ageEl.offsetWidth; ageEl.classList.add('bump');
  SFX.age(n); setCandles(n);
  if(user&&Math.random()<.18){ const [x,y]=ctr(ageEl,true); hearts(x,y,1); }
  if(n===birthdayAge){ setBase('happy'); const [x,y]=ctr($('#cake'),true); burst(x,y+30,6); }
  else{ if(base==='happy')setBase('idle'); const r=Math.random(); if(n>=40)flash('surprised',450); else if(r<.4)anim('tilt',300); else if(r<.6)flash('blink',250); }
  if(n===100)toast(T.age100Egg); }
function holdBtn(id,d){ const b=$(id); let t1,t2; const stop=()=>{clearTimeout(t1);clearInterval(t2)};
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); setAge(age+d,true); t1=setTimeout(()=>{t2=setInterval(()=>setAge(age+d,true),90)},420); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop)); }
holdBtn('#dn',-1); holdBtn('#up',1);
async function cakeScene(){ await go('cake'); age=15; ageEl.textContent=15; cds.innerHTML=''; setCandles(15); cakeState='age'; lockAge=false;
  $('#qt').textContent=T.question; $('#qp').src=marcusPortrait; setBase('idle'); showMadi('26%'); anim('drop',700); }
$('#cake').addEventListener('pointerdown',e=>{ if(cakeState==='age'||cakeState==='lock'){ toast(T.patience); SFX.err(); anim('tilt',300); }
  else if(cakeState==='wish'&&e.target.closest('#cds')){ toast(T.cheating); SFX.err(); flash('surprised',500); } });
$('#submit').onclick=async()=>{ if(lockAge)return; SFX.click(); if(age!==birthdayAge)return wrong(); lockAge=true; cakeState='lock';
  SFX.win(); setBase('excited'); anim('bounce',1100); shake(); const cs=[...cds.children]; cs.forEach((c,i)=>setTimeout(()=>{c.classList.add('lit');SFX.light(i)},i*70));
  const [x,y]=ctr($('#cake'),true); burst(x,y,24); setTimeout(()=>burst(x-30,y+10,14),250); setTimeout(()=>burst(x+30,y+10,14),450);
  $('#ctl').style.display='none'; await sleep(600); await lines(T.correct); hideDlg(); wishScene(); };
function wrong(){ SFX.err(); shake(); const a=age;
  let m=T.exact[a]||(a===1?T.age1:a===100?T.age100:a>=70?T.age70:a>=40?T.age40:a===15?T.age15:a===17?T.age17:null);
  if(!m){ let pool=T.wrong; if(a<=12&&Math.random()<.6)pool=T.young; else if(a>=20&&Math.random()<.6)pool=T.old; let n=0; do{m=pick(pool)}while(m===lastWrong&&n++<8); }
  lastWrong=m; toast(m,3000); flash('surprised',600); }

// ---- Wish / blow out ----
let blown=false, micS=null, micC=null, micT=null;
async function wishScene(){ await go('cake','s-cake s-wish'); $('#ctl').style.display=''; blown=false; cakeState='wish';
  $$('#cds .cd').forEach(c=>c.classList.add('lit')); setBase('wish'); showMadi('26%'); setTempo(520);
  await lines(T.wish); await lines(T.micTip); hideDlg(); $('#blowB').hidden=false; startMic(); }
async function startMic(){ try{ if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return; micS=await navigator.mediaDevices.getUserMedia({audio:true});
  if(blown){stopMic();return} micC=new (window.AudioContext||window.webkitAudioContext)(); const src=micC.createMediaStreamSource(micS), an=micC.createAnalyser(); an.fftSize=512; src.connect(an);
  const d=new Uint8Array(an.fftSize); let hot=0; micT=setInterval(()=>{ an.getByteTimeDomainData(d); let m=0; for(const v of d)m=Math.max(m,Math.abs(v-128)); hot=m>85?hot+1:0; if(hot>=3)blow(); },60); }catch(e){} }
function stopMic(){ clearInterval(micT); try{micS&&micS.getTracks().forEach(t=>t.stop())}catch(e){} try{micC&&micC.close()}catch(e){} micS=micC=null; }
$('#blowB').onclick=()=>{ initAudio(); blow(); };
async function blow(){ if(blown)return; blown=true; stopMic(); $('#blowB').hidden=true; cakeState='done'; SFX.blow(); setBase('wish'); flash('surprised',300);
  const cs=[...cds.querySelectorAll('.cd')]; cs.forEach((c,i)=>setTimeout(()=>{ c.classList.remove('lit'); const [x,y]=ctr(c,true); smoke(x,y); smoke(x+2,y-4); },i*90));
  game.classList.add('dim'); await sleep(cs.length*90+400); await sleep(900);
  SFX.conf(); confetti(); setTimeout(confetti,700); setBase('excited'); anim('bounce',1100); setTempo(420);
  await lines(T.afterBlow,'marcus'); hideDlg(); $('#contB').hidden=false; }
$('#contB').onclick=()=>{ SFX.click(); $('#contB').hidden=true; poemScene(); };

// ---- Poem ----
const poemEl=$('#poem');
async function poemScene(){ await go('poem'); setBase('calm'); showMadi('50%'); setTempo(760);
  poemEl.className=''; $('#note').className=''; $('#note2').className=''; $('#paper').style.height='0px';
  poemEl.innerHTML=poem.map(l=>l?`<div class="ln"><b>${l[0]}</b><span>${l.slice(1)}</span></div>`:'<div class="gap"></div>').join('');
  if(!$('.ff')) for(let i=0;i<8;i++){const f=document.createElement('i'); f.className='ff'; f.style.cssText=`left:${rnd(5,90)}%;bottom:${rnd(18,30)}%;animation-delay:${rnd(0,5)}s`; $('#sc-poem').appendChild(f);}
  await sleep(900); const ls=$$('#poem .ln'); let i=0;
  $('#paper').style.height=poemEl.offsetHeight+'px'; [180,230,290,350].forEach((f,k)=>tone(f,.25,'triangle',.03,k*.35)); await sleep(2500);
  for(const l of $$('#poem > div')){ if(l.classList.contains('gap')){await sleep(800);continue} l.classList.add('show'); SFX.line(i++); await sleep(1650); }
  await sleep(1800); poemEl.classList.add('dim'); await sleep(2400);
  await sleep(1200);
  ls.forEach((l,k)=>{ l.querySelector('b').style.transitionDelay=k*.18+'s'; }); poemEl.classList.add('rev'); SFX.reveal(); await sleep(2600);
  $('#note2').textContent=[...'HAPPY'].join(' ')+'   '+[...'BIRTHDAY'].join(' '); $('#note2').classList.add('on'); await sleep(2800); $('#keepB').hidden=false; }
$('#secret').addEventListener('pointerdown',e=>{ e.stopPropagation(); SFX.found(); toast(T.secretStar,2600); const [x,y]=ctr($('#secret')); burst(x,y,10); $('#secret').style.display='none'; });
$('#keepB').onclick=()=>{ SFX.click(); $('#keepB').hidden=true; finalScene(); };

// ---- Final ----
async function finalScene(){ await go('final'); mi.style.transform=''; setBase('final'); showMadi('50%'); setTempo(900);
  $('#stars').innerHTML=''; makeStars(70,true); $('#f1').className=$('#f2').className=''; $('#hs').innerHTML=''; $('#hs').className='';
  await sleep(900); await lines(T.final); hideDlg(); await sleep(2800); starHeart(); }
async function starHeart(){ const Wd=game.clientWidth,H=game.clientHeight, k=Math.min(Wd*.55/32,H*.3/29), cx=Wd/2, cy=H*.27, hs=$('#hs'), N=30, els=[];
  hs.style.cssText=`position:absolute;inset:0;transform-origin:${cx}px ${cy}px;z-index:2`;
  for(let i=0;i<N;i++){ const t=i/N*Math.PI*2, hx=16*Math.pow(Math.sin(t),3), hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    const e=document.createElement('div'); e.className='hs'; e.style.left=rnd(0,Wd)+'px'; e.style.top=rnd(0,H*.45)+'px'; e.style.transitionDelay=(i*60)+'ms'; hs.appendChild(e); els.push([e,cx+hx*k,cy+hy*k]); }
  await sleep(60); els.forEach(([e,x,y])=>{ e.style.left=x+'px'; e.style.top=y+'px'; }); SFX.heart(); await sleep(4500+N*60+300);
  hs.classList.add('beat'); const hh=$('#hh'); hh.style.cssText=`left:${cx-17*k}px;top:${cy-15*k}px;width:${34*k}px;height:${32*k}px`;
  const fm=$('#fm'); fm.style.top=(cy+17*k+22)+'px'; $('#f1').textContent=T.finalHeart; $('#f1').classList.add('on'); SFX.reveal(); await sleep(3200);
  $('#f2').textContent=T.signoff; $('#f2').classList.add('on'); await sleep(2500); $('#againB').hidden=false; }
$('#hh').addEventListener('pointerdown',e=>{ const hs=$('#hs'); hs.classList.remove('beat','pulse'); void hs.offsetWidth; hs.classList.add('pulse'); SFX.pop();
  const [x,y]=ctr($('#hh')); hearts(x,y,8); setTimeout(()=>hearts(x,y,6),180); setTimeout(()=>{hs.classList.remove('pulse');hs.classList.add('beat')},520); });
$('#againB').onclick=()=>{ SFX.click(); location.reload(); };

/* =====================================================================
   10. BOOT
   ===================================================================== */
buildSprites(); fit(); makeStars(40); setBase('idle');
</script>
</body></html>
